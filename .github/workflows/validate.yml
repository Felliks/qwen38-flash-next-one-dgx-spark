name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: bash -n run-spark.sh
      - name: Compile Python sources
        run: |
          python -m py_compile \
            patch_qwen4_ple_disk_cache.py \
            patch_sm121_qsa_sdpa.py \
            prepare_ple.py
      - name: Reject private deployment details
        run: |
          python - <<'PY'
          from pathlib import Path

          needles = (b"/home/" + b"felliks", b"10." + b"8.0.")
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in {".git", "assets"} for part in path.parts):
                  continue
              data = path.read_bytes()
              if any(needle in data for needle in needles):
                  violations.append(str(path))

          if violations:
              raise SystemExit("Private deployment details found: " + ", ".join(violations))
          PY
